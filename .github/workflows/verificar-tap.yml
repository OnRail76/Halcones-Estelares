# Compila y verifica exclusivamente la edición definitiva 1.3.3.
# Solo lectura: sin publicaciones, etiquetas ni escrituras al repositorio.
name: Verificar HALCONES ESTELARES v1.3.3

on:
  push:
    branches: [main]
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.3.3/**'
      - '.github/workflows/verificar-tap.yml'
  pull_request:
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.3.3/**'
      - '.github/workflows/verificar-tap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar dependencias
        run: python3 -m pip install Pillow pytest
      - name: Construir desde fuentes 1.3.3
        run: python3 fuentes/1.3.3/build.py
      - name: Comprobar TAP oficial y construcción byte a byte
        shell: bash
        run: |
          set -euo pipefail
          SHA="0db551592d01900287f0dad4754b840589075fb50ae3e7405ea66dbf21266ddf"
          echo "$SHA  JUEGO/HALCONES_ESTELARES_1_3_3.tap" | sha256sum -c -
          echo "$SHA  fuentes/1.3.3/HALCONES_ESTELARES_1_3_3.tap" | sha256sum -c -
          echo "$SHA  fuentes/1.3.3/build/HALCONES_ESTELARES_V281.tap" | sha256sum -c -
          cmp JUEGO/HALCONES_ESTELARES_1_3_3.tap fuentes/1.3.3/build/HALCONES_ESTELARES_V281.tap
      - name: Pruebas v1.3.3
        run: cd fuentes/1.3.3 && python3 -m pytest -q
