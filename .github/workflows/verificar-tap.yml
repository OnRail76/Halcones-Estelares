# Verificación exclusiva de HALCONES ESTELARES v1.4.
name: Verificar HALCONES ESTELARES v1.4

on:
  push:
    branches: [main]
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.4/**'
      - '.github/workflows/verificar-tap.yml'
  pull_request:
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.4/**'
      - '.github/workflows/verificar-tap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python3 -m pip install Pillow
      - name: Recompilar TAP definitivo 1.4
        run: python3 fuentes/1.4/build.py
      - name: Verificación reproducible
        shell: bash
        run: |
          set -euo pipefail
          SHA="7c595b9d7f61cba9145ce6a16e883ca0653750ac52a3cc2845066045967d1cad"
          echo "$SHA  JUEGO/HALCONES_ESTELARES_1_4.tap" | sha256sum -c -
          echo "$SHA  fuentes/1.4/HALCONES_ESTELARES_1_4.tap" | sha256sum -c -
          echo "$SHA  fuentes/1.4/build/HALCONES_ESTELARES_V281.tap" | sha256sum -c -
          cmp JUEGO/HALCONES_ESTELARES_1_4.tap fuentes/1.4/build/HALCONES_ESTELARES_V281.tap
