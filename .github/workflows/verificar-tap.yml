# Verificación de solo lectura: no hace commits, pushes ni publica Releases.
name: Verificar HALCONES ESTELARES (v1.0 y v1.3.2)

on:
  push:
    branches: [main]
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.3.2/**'
      - '.github/workflows/verificar-tap.yml'
  pull_request:
    paths:
      - 'JUEGO/**'
      - 'fuentes/1.3.2/**'
      - '.github/workflows/verificar-tap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-taps:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Pillow para los generadores de gráficos
        run: python3 -m pip install Pillow
      - name: Reconstruir V1.3.2 desde los fuentes Z80
        run: python3 fuentes/1.3.2/build.py
      - name: Comprobar los TAP originales y el reconstruido
        run: |
          set -euo pipefail
          echo "fca50d5b7b1b81bbfdf5141853a5a4905568ce660d2d57824162bfe0c4c8e648  JUEGO/HALCONES_ESTELARES_FINAL_1_0.tap" | sha256sum -c -
          echo "456d80834563321eb171b6f52e1f23d7c467b6f330b7b2d9e13eb9894605fe6b  JUEGO/HALCONES_ESTELARES_1_3_2.tap" | sha256sum -c -
          echo "456d80834563321eb171b6f52e1f23d7c467b6f330b7b2d9e13eb9894605fe6b  fuentes/1.3.2/build/HALCONES_ESTELARES_V281.tap" | sha256sum -c -
